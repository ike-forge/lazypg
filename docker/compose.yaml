services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: lazypg
      POSTGRES_PASSWORD: lazypg
      POSTGRES_DB: lazypg
    ports:
      - "${LP_PG_PORT:-5432}:5432"
    volumes:
      - ./seed:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lazypg -d lazypg"]
      interval: 2s
      timeout: 2s
      retries: 30
