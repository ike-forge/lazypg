[workspace]
resolver = "3"
members = [
    "crates/lp-domain",
    "crates/lp-inbound",
    "crates/lp-outbound",
    "crates/lp-app",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97.1"
publish = false
license = "0BSD"
repository = "https://github.com/ike-forge/lazypg"
homepage = "https://github.com/ike-forge/lazypg"

[workspace.dependencies]
lp-domain = { path = "crates/lp-domain" }
lp-inbound = { path = "crates/lp-inbound" }
lp-outbound = { path = "crates/lp-outbound" }

anyhow = "1.0.104"
async-trait = "0.1.91"
# `osc52` puts `crossterm::clipboard::CopyToClipboard` in reach: a yank is an
# escape sequence, so no display server is needed.
crossterm = { version = "0.29.0", features = ["osc52"] }
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.19"
# The grid measures its own column widths; `chars().count()` is wrong for
# real data.
unicode-width = "0.2.2"
# NFC makes a decomposed accent measure the same in every terminal.
unicode-normalization = "0.1.26"
# `process` and `io-util` are the clipboard helper, reaped by the runtime.
tokio = { version = "1.54.1", features = [
    "fs",
    "io-util",
    "macros",
    "process",
    "rt-multi-thread",
    "sync",
    "time",
] }
# The driver. Default features only: rows are read as Postgres's own text
# rendering (lp-outbound/src/postgres.rs), so no type-crate integrations.
tokio-postgres = "0.7.18"
tokio-postgres-rustls = { version = "0.14.0", features = ["aws-lc-rs"] }
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
rustls-native-certs = "0.8.4"
rustls-pki-types = { version = "1.15.1", features = ["std"] }
# Read-only TOML; dropping `display` drops `toml_writer`.
toml = { version = "1.1.4", default-features = false, features = [
    "std",
    "serde",
    "parse",
] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[profile.dist]
inherits = "release"
